<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANA – In the making</title>
<meta name="description" content="Our first collection is being cut and sewn. Check back soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6eaf1; --ink:#17233b; --thread:#b86a00; --tick:rgba(23,35,59,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#15213a;--ink:#e9edf4;--thread:#f2a93b;--tick:rgba(233,237,244,.4);}
}
:root[data-theme="dark"]{--paper:#15213a;--ink:#e9edf4;--thread:#f2a93b;--tick:rgba(233,237,244,.4);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-stretch:100%;overflow-x:hidden;position:relative;
}
.page{
  min-height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(1.25rem,4vw,3rem) clamp(1.25rem,5vw,4rem) 0;position:relative;z-index:1;
}
.mark{display:inline-flex;align-items:center;font-weight:700;font-size:1.05rem;letter-spacing:.01em;font-stretch:125%}
.mark .ar{margin-left:.9rem;padding-left:.9rem;border-left:1px solid var(--tick);font-family:"Reem Kufi","Noto Kufi Arabic",Tahoma,sans-serif;font-stretch:100%;font-weight:600;font-size:1.7rem;line-height:1;letter-spacing:0}
main{align-self:end;padding:clamp(3rem,12vh,8rem) 0 clamp(2rem,6vh,4rem)}
h1{
  margin:0;font-weight:800;font-stretch:125%;
  font-size:clamp(3.25rem,14.5vw,12.5rem);line-height:.86;letter-spacing:-.035em;
}
.note{margin:clamp(1.5rem,3vw,2.5rem) 0 0;max-width:34ch;font-size:clamp(1.05rem,1.6vw,1.3rem);line-height:1.45}
.note b{font-weight:700}
.tape{
  height:22px;margin:0 calc(-1 * clamp(1.25rem,5vw,4rem));
  background:
    repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 10px) bottom/100% 8px no-repeat,
    repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 50px) bottom/100% 16px no-repeat;
}
footer{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 0 1rem;font-size:.85rem;opacity:.75}
.stitch{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stitch .seam{fill:none;stroke:var(--thread);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:12 10;animation:march 1.1s linear infinite}
.stitch .reveal{fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:sew 3.2s .3s cubic-bezier(.6,0,.2,1) forwards}
.stitch .knot{fill:var(--thread)}
@keyframes sew{to{stroke-dashoffset:0}}
@keyframes march{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.stitch .reveal{animation:none;stroke-dashoffset:0}.stitch .seam{animation:none}}
</style>
</head>
<body>
<svg class="stitch" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <mask id="m"><path class="reveal" pathLength="1" d="M-20,120 C220,40 360,330 560,250 S860,60 1020,300"/></mask>
  </defs>
  <path class="seam" mask="url(#m)" d="M-20,120 C220,40 360,330 560,250 S860,60 1020,300"/>
  <circle class="knot" cx="-20" cy="120" r="5"/>
</svg>
<div class="page">
  <header><span class="mark">ANA<span class="ar" lang="ar" dir="rtl">أنا</span></span></header>
  <main>
    <h1>In the<br>making.</h1>
    <p class="note"><b>Our first collection is being cut and sewn.</b> The full site is on its way. Check back soon.</p>
  </main>
  <div>
    <div class="tape" aria-hidden="true"></div>
    <footer><span>© 2026 ANA</span><span>Work in progress</span></footer>
  </div>
</div>
</body>
</html>
